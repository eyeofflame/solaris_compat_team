buildscript {
    repositories {

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version "0.7.+"
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {


    mappings channel: mapping_channel, version: mapping_version


    copyIdeResources = true


    runs {

        configureEach {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {

            property 'forge.enabledGameTestNamespaces', mod_id
            jvmArgs("-Xmx6G")

        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'

        }


        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {

            workingDirectory project.file('run-data')


            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven {

        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven { url 'https://modmaven.dev/' }
    maven {
        url 'https://maven.blakesmods.com'
    }
    flatDir {
        dirs 'libs', 'libs/coin'
    }
}


configurations {
    solarisCompile {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.CLASSES))
        }
    }
}

dependencies {


    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1.0,)")
    }


    implementation fg.deobf("libs:cloth-config:11.1.136-forge")

    implementation(
            fg.deobf("libs:ftb-library:forge-2001.2.13"),
            fg.deobf("libs:ftb-teams:forge-2001.3.2"),
            fg.deobf("libs:item-filters:forge-2001.1.0-build.59")
    )

    implementation fg.deobf("mekanism:Mekanism:${mekanism_version}")

    implementation(
            fg.deobf("libs:justdirethings:1.1.7"),
            fg.deobf("libs:cofh_core:1.20.1-11.0.2.56"),
            fg.deobf("libs:thermal_expansion:1.20.1-11.0.1.29"),
            fg.deobf("libs:thermal_foundation:1.20.1-11.0.6.70")
    )


    compileOnly fg.deobf("libs:thermal_core:1.20.1-11.0.6.24")

    implementation fg.deobf("libs:corpse:forge-1.20.1-1.0.23")

    implementation fg.deobf("libs:ldlib-forge-1.20.1:1.0.52.a")

    implementation(
            fg.deobf("libs:functionalstorage-1.20.1:1.2.14"),
            fg.deobf("libs:titanium-1.20.1:3.8.35")
    )


    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")


    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    implementation fg.deobf("com.blakebr0.cucumber:Cucumber:${cucumber_version}")
    implementation fg.deobf("com.blakebr0.mysticalagriculture:MysticalAgriculture:${mysticalagriculture_version}")

    implementation fg.deobf("libs:jei:1.20.1-forge-15.62.0.216")

    runtimeOnly(
            fg.deobf("libs:Bookshelf:Forge-1.20.1-20.2.15"),
            fg.deobf("libs:Coins:Forge-1.20.1-13.0.4")
    )


    compileOnly files(configurations.solarisCompile)
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}


tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }


    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
