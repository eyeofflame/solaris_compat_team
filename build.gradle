buildscript {
    repositories {

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {


    mappings channel: mapping_channel, version: mapping_version


    copyIdeResources = true


    runs {

        configureEach {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {

            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }


        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {

            workingDirectory project.file('run-data')


            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'libs', 'libs/rpg', 'libs/rpg/extra'
    }
}

// ===== Solaris 跨工程编译期依赖（消费 named classes 变体）=====
// 跨工程直接依赖产出的 jar 不可用：reobfJar 会原地覆盖成 SRG 名，编译不过。
// 这里改为消费其 classes 变体（build/classes/java/main，named 映射）。
// 用法：在 dependencies 里写   solarisCompile "dev.efm:solaris_core:1.1.6-hotfix"
// 注意：依赖关系必须无环。
configurations {
    solarisCompile {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.CLASSES))
        }
    }
}

dependencies {


    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation(
            fg.deobf("libs:ftb-library:forge-2001.2.13"),
            fg.deobf("libs:ftb-teams:forge-2001.3.2"),
            fg.deobf("libs:item-filters:forge-2001.1.0-build.59"),
            fg.deobf("libs:architectury:9.2.14-forge"),
            fg.deobf("libs:ftb-quests:forge-2001.4.22")
    )

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1.0,)")
    }

    implementation(
            fg.deobf("libs:solaris_rpg:1.1.2.a"),
            fg.deobf("libs:kubejs:forge-2001.6.5-build.26"),
            fg.deobf("libs:ldlib:forge-1.20.1-1.0.52.a"),
            fg.deobf("libs:rhino:forge-2001.2.3-build.10")
    )

    // Solaris 跨工程编译期依赖统一走这里（见上方 solarisCompile 说明）
    //solarisCompile "dev.efm:solaris_compat:1.1.2.a"
    compileOnly files(configurations.solarisCompile)

    // libs/rpg/extra 下的全部 jar：仅运行时加载，不参与编译
    runtimeOnly fg.deobf("libs:supplementaries:1.20-3.1.43-forge")
    runtimeOnly fg.deobf("libs:moonlight:1.20-2.16.35-forge")
    runtimeOnly fg.deobf("libs:FarmersDelight:1.20.1-1.3.4")
    runtimeOnly fg.deobf("libs:create:1.20.1-6.0.8")
    runtimeOnly fg.deobf("libs:amendments:1.20-2.2.6")

}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}


tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }


    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
