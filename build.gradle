buildscript {
    repositories {

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version


def utf8GradleProperties = new Properties()
file('gradle.properties').withInputStream { utf8GradleProperties.load(it.newReader('UTF-8')) }
def modAuthors = utf8GradleProperties.getProperty('mod_authors')

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {


    mappings channel: mapping_channel, version: mapping_version


    copyIdeResources = true


    runs {

        configureEach {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'REGISTRIES'


            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {

            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }


        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('build/ore-gametest')
            mods {
                "${mod_id}" { source sourceSets.test }
            }
        }

        data {

            workingDirectory project.file('run-data')


            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {


    flatDir {
        dirs 'libs', 'libs/runtime'
    }
}

dependencies {


    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation(
            fg.deobf("libs:ars_nouveau:1.20.1-4.12.7-all"),
            fg.deobf("libs:curios:forge-5.14.1+1.20.1"),
            fg.deobf("libs:geckolib:forge-1.20.1-4.8.4"),
            fg.deobf("libs:Patchouli:1.20.1-85-FORGE")
    )

    implementation(
            fg.deobf("libs:create:1.20.1-6.0.8"),
            fg.deobf("libs:ldlib:forge-1.20.1-1.0.52.a")
    )


    compileOnly fg.deobf("libs:Ponder-Forge-1.20.1:1.0.91")

    testCompileOnly fg.deobf("libs:Ponder-Forge-1.20.1:1.0.91")

    runtimeOnly fg.deobf("libs:Jade:1.20.1-Forge-11.13.3")
    compileOnly fg.deobf("libs:Registrate:MC1.20-1.3.3")
}


tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : modAuthors, mod_description: '''A mod that generate resources through magic in Solaris modpack''',]

    inputs.properties replaceProperties

    filteringCharset = 'UTF-8'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}


tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : modAuthors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : modAuthors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }


    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('testAtomConfig', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.efm.solaris_resources.common.config.AtomConfigStoreTest'
}

tasks.named('check') { dependsOn 'testAtomConfig' }

tasks.register('testWorldgenConfig', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.efm.solaris_resources.common.config.WorldgenConfigStoreTest'
}

tasks.named('check') { dependsOn 'testWorldgenConfig' }

tasks.register('testOrePolicy', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.efm.solaris_resources.common.worldgen.OreGenerationPolicyTest'
}

tasks.named('check') { dependsOn 'testOrePolicy' }

tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn testClasses }

tasks.register('testSpellEffectRange', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.efm.solaris_resources.common.spells.SpellEffectRangeTest'
}

tasks.named('check') { dependsOn 'testSpellEffectRange' }

tasks.register('testMachineConfig', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.efm.solaris_resources.common.config.MachineConfigStoreTest'
}

tasks.named('check') { dependsOn 'testMachineConfig' }
